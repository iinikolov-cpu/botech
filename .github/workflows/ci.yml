name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true  # всегда свежий патч-релиз Go: в стандартной библиотеке бывают уязвимости
      - name: Форматирование
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Тесты с проверкой гонок
        run: go test -race ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Уязвимости в зависимостях
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Сборка образа
        run: docker build -t botech:ci .
