# Шаблон сценария тайного покупателя.
# Заполните поля, сохраните файл и отправьте его боту (как документ).
# Если загрузить файл с тем же key ещё раз, создастся новая версия сценария.
# Старые задания продолжат работать по той версии, по которой были выданы.

key: bts-tashkent-pvz-delivery   # уникальный ключ: латиница, цифры, - и _ (3-40 символов)
title: Получение посылки в ПВЗ    # название сценария
operator: BTS                     # логистический оператор
city: Ташкент                     # необязательно
pvz: ПВЗ на ул. Навои, 10         # необязательно

# Шаги инструкции для покупателя (по порядку).
steps:
  - Оформите заказ в приложении и выберите доставку ПВЗ-ПВЗ.
  - Оплатите доставку выданным промокодом.
  - Отправьте посылку в ПВЗ отправления и сохраните чек.
  - Когда посылка придёт, заберите её в ПВЗ получения.

# Вопросы отчёта. type: text | rating (оценка 1-5) | yesno | photo | video
# required: true, если ответ обязателен (по умолчанию true).
questions:
  - key: staff_polite
    text: Насколько вежливо вас обслужили в ПВЗ?
    type: rating
  - key: id_checked
    text: Сотрудник проверил документ или код получения?
    type: yesno
  - key: parcel_condition
    text: Сфотографируйте посылку при получении.
    type: photo
  - key: comment
    text: Что бы вы улучшили в работе ПВЗ?
    type: text
    required: false
