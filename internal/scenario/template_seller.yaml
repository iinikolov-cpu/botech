# Шаблон сценария ТАЙНОГО ПРОДАВЦА (kind: seller).
# Продавцу не выдаются айтем, промокод и не запрашиваются данные для компенсации:
# только инструкция и чек-лист отчёта.
# Заполните поля, сохраните файл и отправьте его боту (как документ).
# Если загрузить файл с тем же key ещё раз, создастся новая версия сценария.
# Старые задания продолжат работать по той версии, по которой были выданы.

key: emu-tashkent-seller-handover   # уникальный ключ: латиница, цифры, - и _ (3-40 символов)
kind: seller                         # тип сценария: buyer (покупатель) или seller (продавец). Менять у существующего key нельзя
title: Передача посылки покупателю   # название сценария
operator: EMU                        # логистический оператор
city: Ташкент                        # необязательно
pvz: ПВЗ на ул. Навои, 10            # необязательно

# Шаги инструкции для продавца (по порядку).
steps:
  - Разместите объявление и дождитесь заказа покупателя.
  - Отправьте посылку через ПВЗ отправления.
  - Сохраните чек отправки.

# Вопросы отчёта. type: text | rating (оценка 1-5) | yesno | photo | video
# required: true, если ответ обязателен (по умолчанию true).
questions:
  - key: staff_polite
    text: Насколько вежливо вас обслужили в ПВЗ отправления?
    type: rating
  - key: label_help
    text: Сотрудник помог оформить отправление?
    type: yesno
  - key: receipt_photo
    text: Сфотографируйте чек отправки.
    type: photo
  - key: comment
    text: Что бы вы улучшили в работе ПВЗ?
    type: text
    required: false
